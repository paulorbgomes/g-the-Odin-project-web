<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Div x Span</title>
        <style>
            div {
                outline: 2px solid red;
            }

            span {
                outline: 2px solid blue;
            }
        </style>
    </head>

    <body>

        <div>Div 1 ...</div>
        <div>Div 2 ...</div>
        <div>Div 3 ...</div>

        <br><br>

        <span>Span 1 ...</span>
        <span>Span 2 ...</span>
        <span>Span 3 ...</span>
        
    </body>

</html>
