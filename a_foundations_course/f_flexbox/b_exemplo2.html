<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exmple 2</title>
    <style>
        .flex-container {
            display: flex;
            flex-direction: row;
        }

        .flex-container div {
            background-color: peachpuff;
            border: 4px solid brown;
            height: 100px;
            width: 10px;
            flex: 1;
        }

        .flex-container .two {
            flex: 2 1 0%;
        }

    </style>
</head>

<body>
    <div class="flex-container">
        <div class="one"></div>
        <div class="two"></div>
        <div class="three"></div>
    </div>
</body>

</html>
